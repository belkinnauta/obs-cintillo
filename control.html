<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Remoto - Cintillos OBS</title>
    <style>
        body {
            background-color: #090814;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: min(100%, 450px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #93c5fd;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #131124;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-show {
            background: #10b981;
            color: white;
        }
        .btn-show:hover {
            background: #059669;
        }
        .btn-hide {
            background: #ef4444;
            color: white;
        }
        .btn-hide:hover {
            background: #dc2626;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            min-height: 16px;
        }
        .sync {
            margin-top: 8px;
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            min-height: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Control Remoto • OBS</h2>
        <div class="form-group">
            <label for="titulo">Nombre Principal</label>
            <input type="text" id="titulo" placeholder="Ej. Carlos Mendoza">
        </div>
        <div class="form-group">
            <label for="subtitulo">Texto Secundario / Cargo</label>
            <input type="text" id="subtitulo" placeholder="Ej. Conductor Titular">
        </div>
        <div class="button-group">
            <button class="btn-show" onclick="enviarEstado(true)">🔴 Al Aire</button>
            <button class="btn-hide" onclick="enviarEstado(false)">⚫ Ocultar</button>
        </div>
        <div class="status" id="status-text">Listo para transmitir</div>
        <div class="sync" id="sync-text">Sincronización: --:--:--</div>
    </div>

    <script>
        const API_URL = 'https://api.npoint.io/65261e4b868a2d1645e9';
        let statusResetTimer = null;

        function setStatus(message, color = '#6b7280') {
            const status = document.getElementById('status-text');
            status.textContent = message;
            status.style.color = color;
        }

        function setSyncText(label) {
            const syncText = document.getElementById('sync-text');
            syncText.textContent = 'Sincronización: ' + label;
        }

        function getTimeStamp() {
            return new Date().toLocaleTimeString('es-MX', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }

        async function cargarEstadoActual() {
            try {
                const response = await fetch(API_URL + '?t=' + Date.now(), {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();
                const titulo = typeof data?.titulo === 'string' ? data.titulo.trim() : '';
                const subtitulo = typeof data?.subtitulo === 'string' ? data.subtitulo.trim() : '';

                document.getElementById('titulo').value = titulo;
                document.getElementById('subtitulo').value = subtitulo;
                setSyncText(getTimeStamp());

                if (data?.activo === true) {
                    setStatus('Último estado: Al Aire', '#10b981');
                } else if (data?.activo === false) {
                    setStatus('Último estado: Oculto', '#ef4444');
                } else {
                    setStatus('Estado cargado', '#93c5fd');
                }
            } catch (error) {
                console.error('No se pudo cargar el estado actual:', error);
                setStatus('No se pudo cargar el estado', '#ef4444');
            }
        }

        async function enviarEstado(activo) {
            const titulo = document.getElementById('titulo').value.trim();
            const subtitulo = document.getElementById('subtitulo').value.trim();
            const data = {
                titulo: titulo,
                subtitulo: subtitulo,
                activo: activo
            };

            setStatus('Enviando a la nube...', '#f59e0b');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                setSyncText(getTimeStamp());
                setStatus(activo ? '¡Enviado: Al Aire!' : '¡Enviado: Oculto!', activo ? '#10b981' : '#ef4444');
            } catch (error) {
                console.error('Error de conexión:', error);
                setStatus('Error de conexión', '#ef4444');
            }

            if (statusResetTimer) {
                clearTimeout(statusResetTimer);
            }

            statusResetTimer = setTimeout(() => {
                setStatus('Listo para transmitir', '#6b7280');
            }, 2200);
        }

        window.addEventListener('DOMContentLoaded', cargarEstadoActual);
    </script>
</body>
</html>
