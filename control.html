<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Remoto - Cintillos OBS</title>
    <style>
        body {
            background-color: #090814;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: min(100%, 450px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #93c5fd;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            text-align: center;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #131124;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        .button-group { display: flex; gap: 12px; margin-top: 25px; }
        button {
            flex: 1;
            padding: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: .6; cursor: wait; }
        .btn-show { background: #10b981; color: white; }
        .btn-show:hover { background: #059669; }
        .btn-hide { background: #ef4444; color: white; }
        .btn-hide:hover { background: #dc2626; }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            min-height: 16px;
        }
        .sync {
            margin-top: 8px;
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            min-height: 14px;
        }
        .file-note {
            margin-top: 8px;
            font-size: 11px;
            color: #9ca3af;
        }
        @media (max-width: 360px) {
            body { padding: 12px; }
            .container { padding: 18px; }
            .button-group { gap: 8px; }
            button { padding: 12px 8px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h2>Control Remoto • OBS</h2>
        <div class="form-group">
            <label for="titulo">Nombre Principal</label>
            <input type="text" id="titulo" maxlength="80" placeholder="Ej. Carlos Mendoza" autocomplete="name">
        </div>
        <div class="form-group">
            <label for="subtitulo">Texto Secundario / Cargo</label>
            <input type="text" id="subtitulo" maxlength="120" placeholder="Ej. Conductor Titular">
        </div>
        <div class="form-group">
            <label for="bg-url">URL de fondo / imagen PNG</label>
            <input type="url" id="bg-url" placeholder="https://.../cintillo.png">
            <div class="file-note">O carga un PNG local y se guardará como dato temporal del navegador.</div>
            <input type="file" id="bg-file" accept="image/png,image/jpeg,image/webp" style="margin-top:10px;">
        </div>
        <div class="button-group">
            <button class="btn-show" id="show-button" type="button">🔴 Al Aire</button>
            <button class="btn-hide" id="hide-button" type="button">⚫ Ocultar</button>
        </div>
        <div class="status" id="status-text" role="status" aria-live="polite">Cargando estado…</div>
        <div class="sync" id="sync-text">Sincronización: --:--:--</div>
    </main>

    <script>
        const API_URL = 'https://api.npoint.io/2b81ca901938404ea4e7';
        const statusElement = document.getElementById('status-text');
        const syncElement = document.getElementById('sync-text');
        const showButton = document.getElementById('show-button');
        const hideButton = document.getElementById('hide-button');
        const bgUrlInput = document.getElementById('bg-url');
        const bgFileInput = document.getElementById('bg-file');
        let isBusy = false;

        function setStatus(message, color = '#6b7280') {
            statusElement.textContent = message;
            statusElement.style.color = color;
        }

        function markSynced() {
            syncElement.textContent = 'Sincronización: ' + new Date().toLocaleTimeString('es-MX', {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
        }

        function setBusy(busy) {
            isBusy = busy;
            showButton.disabled = busy;
            hideButton.disabled = busy;
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
                reader.readAsDataURL(file);
            });
        }

        function getCurrentPayload() {
            return {
                titulo: document.getElementById('titulo').value.trim(),
                subtitulo: document.getElementById('subtitulo').value.trim(),
                bgImage: (bgUrlInput.value || '').trim(),
                activo: false
            };
        }

        async function cargarEstadoActual() {
            setStatus('Conectando con la nube…', '#f59e0b');
            try {
                const response = await fetch(API_URL + '?t=' + Date.now(), {
                    method: 'GET', cache: 'no-store', headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                    throw new Error('JSON inválido');
                }
                document.getElementById('titulo').value = typeof data.titulo === 'string' ? data.titulo : '';
                document.getElementById('subtitulo').value = typeof data.subtitulo === 'string' ? data.subtitulo : '';
                bgUrlInput.value = typeof data.bgImage === 'string' ? data.bgImage : '';
                markSynced();
                setStatus(data.activo === true ? 'Estado actual: Al Aire' : 'Estado actual: Oculto', data.activo === true ? '#10b981' : '#9ca3af');
            } catch (error) {
                console.error('No se pudo cargar el estado:', error);
                setStatus('No se pudo cargar el estado (' + (error.message || 'error de red') + ')', '#ef4444');
            }
        }

        async function enviarEstado(activo) {
            if (isBusy) return;
            const data = getCurrentPayload();
            data.activo = activo;
            setBusy(true);
            setStatus('Enviando a la nube…', '#f59e0b');
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(data),
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                markSynced();
                setStatus(activo ? '¡Enviado: Al Aire!' : '¡Enviado: Oculto!', activo ? '#10b981' : '#ef4444');
            } catch (error) {
                console.error('No se pudo enviar el estado:', error);
                setStatus('No se pudo enviar (' + (error.message || 'error de red') + ')', '#ef4444');
            } finally {
                setBusy(false);
            }
        }

        bgFileInput.addEventListener('change', async (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            try {
                setStatus('Cargando imagen…', '#f59e0b');
                const dataUrl = await readFileAsDataURL(file);
                bgUrlInput.value = dataUrl;
                setStatus('Imagen cargada, lista para enviar.', '#93c5fd');
            } catch (error) {
                console.error('Error cargando imagen:', error);
                setStatus('No se pudo cargar la imagen', '#ef4444');
            }
        });

        showButton.addEventListener('click', () => enviarEstado(true));
        hideButton.addEventListener('click', () => enviarEstado(false));
        cargarEstadoActual();
    </script>
</body>
</html>
