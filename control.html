<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Remoto - Cintillos OBS</title>
    <style>
        body {
            background-color: #090814;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: min(100%, 450px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #93c5fd;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            text-align: center;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #131124;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        .button-group { display: flex; gap: 12px; margin-top: 25px; }
        button {
            flex: 1;
            padding: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: .6; cursor: wait; }
        .btn-show { background: #10b981; color: white; }
        .btn-show:hover { background: #059669; }
        .btn-hide { background: #ef4444; color: white; }
        .btn-hide:hover { background: #dc2626; }
        .position-box {
            padding: 12px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 8px;
            background: rgba(19,17,36,.7);
        }
        .position-label { margin-bottom: 8px; color: #9ca3af; font-size: 13px; }
        .position-controls {
            display: grid;
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(2, 42px);
            justify-content: center;
            gap: 6px;
        }
        .position-controls button {
            flex: initial;
            padding: 6px;
            background: #27233d;
            color: white;
            font-size: 19px;
        }
        .position-controls button:hover { background: #3b3560; }
        #move-up { grid-column: 2; grid-row: 1; }
        #move-left { grid-column: 1; grid-row: 2; }
        #move-down { grid-column: 2; grid-row: 2; }
        #move-right { grid-column: 3; grid-row: 2; }
        .position-readout { margin-top: 9px; text-align: center; color: #bfdbfe; font-size: 12px; }
        .position-hint, .file-note { margin-top: 8px; font-size: 11px; color: #9ca3af; }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            min-height: 16px;
        }
        .sync {
            margin-top: 8px;
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            min-height: 14px;
        }
        @media (max-width: 360px) {
            body { padding: 12px; }
            .container { padding: 18px; }
            .button-group { gap: 8px; }
            button { padding: 12px 8px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h2>Control Remoto • OBS</h2>
        <div class="form-group">
            <label for="titulo">Nombre Principal</label>
            <input type="text" id="titulo" maxlength="120" placeholder="Ej. Carlos Mendoza" autocomplete="name">
        </div>
        <div class="form-group">
            <label for="subtitulo">Texto Secundario / Cargo</label>
            <input type="text" id="subtitulo" maxlength="240" placeholder="Ej. Conductor Titular">
        </div>
        <div class="form-group">
            <label for="bg-url">URL de fondo / imagen PNG</label>
            <input type="url" id="bg-url" placeholder="https://.../cintillo.png">
            <div class="file-note">O carga una imagen local. Para que OBS la reciba desde otro dispositivo, usa una URL pública.</div>
            <input type="file" id="bg-file" accept="image/png,image/jpeg,image/webp" style="margin-top:10px;">
        </div>
        <div class="form-group position-box">
            <div class="position-label">Posición del nombre y cargo (usa las flechas)</div>
            <div class="position-controls" aria-label="Ajustar posición del texto">
                <button id="move-up" type="button" aria-label="Subir">↑</button>
                <button id="move-left" type="button" aria-label="Mover a la izquierda">←</button>
                <button id="move-down" type="button" aria-label="Bajar">↓</button>
                <button id="move-right" type="button" aria-label="Mover a la derecha">→</button>
            </div>
            <div class="position-readout" id="position-readout">X: 20% · Y: 82%</div>
            <div class="position-hint">Cada toque mueve 1% del lienzo OBS y guarda la posición en la nube.</div>
        </div>
        <div class="button-group">
            <button class="btn-show" id="show-button" type="button">🔴 Al Aire</button>
            <button class="btn-hide" id="hide-button" type="button">⚫ Ocultar</button>
        </div>
        <div class="status" id="status-text" role="status" aria-live="polite">Cargando estado…</div>
        <div class="sync" id="sync-text">Sincronización: --:--:--</div>
    </main>

    <script>
        const API_URL = 'https://api.npoint.io/2b81ca901938404ea4e7';
        const statusElement = document.getElementById('status-text');
        const syncElement = document.getElementById('sync-text');
        const showButton = document.getElementById('show-button');
        const hideButton = document.getElementById('hide-button');
        const bgUrlInput = document.getElementById('bg-url');
        const bgFileInput = document.getElementById('bg-file');
        const positionReadout = document.getElementById('position-readout');
        const positionButtons = [...document.querySelectorAll('.position-controls button')];
        let isBusy = false;
        let currentX = 20;
        let currentY = 82;
        let currentActive = false;

        function setStatus(message, color = '#6b7280') {
            statusElement.textContent = message;
            statusElement.style.color = color;
        }

        function markSynced() {
            syncElement.textContent = 'Sincronización: ' + new Date().toLocaleTimeString('es-MX', {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
        }

        function setBusy(busy) {
            isBusy = busy;
            showButton.disabled = busy;
            hideButton.disabled = busy;
            positionButtons.forEach(button => button.disabled = busy);
        }

        function updatePositionReadout() {
            positionReadout.textContent = 'X: ' + currentX + '% · Y: ' + currentY + '%';
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
                reader.readAsDataURL(file);
            });
        }

        function getCurrentPayload(activo = currentActive) {
            return {
                titulo: document.getElementById('titulo').value.trim(),
                subtitulo: document.getElementById('subtitulo').value.trim(),
                bgImage: (bgUrlInput.value || '').trim(),
                posX: currentX,
                posY: currentY,
                activo
            };
        }

        async function postState(data, successMessage) {
            if (isBusy) return;
            setBusy(true);
            setStatus('Enviando a la nube…', '#f59e0b');
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(data),
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                currentActive = data.activo === true;
                markSynced();
                setStatus(successMessage, currentActive ? '#10b981' : '#93c5fd');
            } catch (error) {
                console.error('No se pudo enviar el estado:', error);
                setStatus('No se pudo enviar (' + (error.message || 'error de red') + ')', '#ef4444');
            } finally {
                setBusy(false);
            }
        }

        async function cargarEstadoActual() {
            setStatus('Conectando con la nube…', '#f59e0b');
            try {
                const response = await fetch(API_URL + '?t=' + Date.now(), {
                    method: 'GET', cache: 'no-store', headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('JSON inválido');
                document.getElementById('titulo').value = typeof data.titulo === 'string' ? data.titulo : '';
                document.getElementById('subtitulo').value = typeof data.subtitulo === 'string' ? data.subtitulo : '';
                bgUrlInput.value = typeof data.bgImage === 'string' ? data.bgImage : '';
                currentX = Number.isFinite(Number(data.posX)) ? Math.min(95, Math.max(0, Number(data.posX))) : 20;
                currentY = Number.isFinite(Number(data.posY)) ? Math.min(95, Math.max(0, Number(data.posY))) : 82;
                currentActive = data.activo === true;
                updatePositionReadout();
                markSynced();
                setStatus(currentActive ? 'Estado actual: Al Aire' : 'Estado actual: Oculto', currentActive ? '#10b981' : '#9ca3af');
            } catch (error) {
                console.error('No se pudo cargar el estado:', error);
                setStatus('No se pudo cargar el estado (' + (error.message || 'error de red') + ')', '#ef4444');
            }
        }

        function moveText(dx, dy) {
            currentX = Math.min(95, Math.max(0, currentX + dx));
            currentY = Math.min(95, Math.max(0, currentY + dy));
            updatePositionReadout();
            postState(getCurrentPayload(), 'Posición guardada en la nube.');
        }

        bgFileInput.addEventListener('change', async (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
                setStatus('Elige un archivo PNG, JPG o WebP.', '#ef4444');
                return;
            }
            try {
                setStatus('Leyendo imagen…', '#f59e0b');
                bgUrlInput.value = await readFileAsDataURL(file);
                setStatus('Imagen lista. Pulsa “Al Aire” para enviarla.', '#93c5fd');
            } catch (error) {
                console.error('Error cargando imagen:', error);
                setStatus('No se pudo leer la imagen.', '#ef4444');
            }
        });

        document.getElementById('move-up').addEventListener('click', () => moveText(0, -1));
        document.getElementById('move-down').addEventListener('click', () => moveText(0, 1));
        document.getElementById('move-left').addEventListener('click', () => moveText(-1, 0));
        document.getElementById('move-right').addEventListener('click', () => moveText(1, 0));
        showButton.addEventListener('click', () => postState(getCurrentPayload(true), '¡Enviado: Al Aire!'));
        hideButton.addEventListener('click', () => postState(getCurrentPayload(false), '¡Enviado: Oculto!'));
        cargarEstadoActual();
    </script>
</body>
</html>
