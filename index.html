<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cintillo OBS</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            background: transparent;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
        }
        #lower-third {
            position: absolute;
            bottom: 60px;
            left: 60px;
            display: flex;
            align-items: stretch;
            max-width: calc(100vw - 120px);
            background: rgba(9, 8, 20, .96);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .55);
            opacity: 0;
            transform: translate3d(-40px, 0, 0);
            pointer-events: none;
            transition: opacity .45s ease, transform .5s cubic-bezier(.16, 1, .3, 1);
        }
        #lower-third.visible { opacity: 1; transform: translate3d(0, 0, 0); }
        .accent-bar {
            flex: 0 0 6px;
            background: linear-gradient(to bottom, #60a5fa, #1d4ed8);
            border-radius: 5px 0 0 5px;
        }
        .text-content {
            min-width: 0;
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #primary-text {
            overflow-wrap: anywhere;
            font-size: 22px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: #fff;
        }
        #secondary-text {
            overflow-wrap: anywhere;
            margin-top: 3px;
            color: #bfdbfe;
            font-size: 14px;
            line-height: 1.3;
            font-weight: 500;
            letter-spacing: .3px;
        }
        @media (max-width: 700px) {
            #lower-third { left: 24px; bottom: 24px; max-width: calc(100vw - 48px); }
            .text-content { padding: 10px 16px; }
            #primary-text { font-size: clamp(16px, 4vw, 22px); }
            #secondary-text { font-size: clamp(12px, 2.8vw, 14px); }
        }
        @media (prefers-reduced-motion: reduce) {
            #lower-third { transition: opacity .01ms; transform: none; }
            #lower-third.visible { transform: none; }
        }
    </style>
</head>
<body>
    <div id="lower-third" aria-live="polite">
        <div class="accent-bar" aria-hidden="true"></div>
        <div class="text-content">
            <span id="primary-text">Nombre</span>
            <span id="secondary-text">Cargo</span>
        </div>
    </div>

    <script>
        const lowerThird = document.getElementById('lower-third');
        const primaryText = document.getElementById('primary-text');
        const secondaryText = document.getElementById('secondary-text');
        const API_URL = 'https://api.npoint.io/65261e4b868a2d1645e9';
        const POLL_INTERVAL_MS = 2000;
        let isFetching = false;

        function applyState(data) {
            primaryText.textContent = typeof data.titulo === 'string' ? data.titulo.trim() : '';
            secondaryText.textContent = typeof data.subtitulo === 'string' ? data.subtitulo.trim() : '';
            lowerThird.classList.toggle('visible', data.activo === true);
        }

        async function verificarEstadoNube() {
            if (isFetching) return;
            isFetching = true;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);

            try {
                const response = await fetch(API_URL + '?t=' + Date.now(), {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);

                const data = await response.json();
                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                    throw new Error('Respuesta inválida de la nube');
                }
                applyState(data);
            } catch (error) {
                console.error('Error leyendo la nube:', error);
                // Mantener el último estado válido mientras la nube no esté disponible.
            } finally {
                clearTimeout(timeout);
                isFetching = false;
                setTimeout(verificarEstadoNube, POLL_INTERVAL_MS);
            }
        }

        verificarEstadoNube();
    </script>
</body>
</html>
