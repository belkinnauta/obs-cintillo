<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cintillo OBS · Full HD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent; color: #fff;
        }
        #lower-third {
            position: absolute;
            left: 64px;
            bottom: 64px;
            display: flex;
            align-items: stretch;
            width: max-content;
            max-width: calc(100vw - 128px);
            min-height: 112px;
            overflow: hidden;
            background: linear-gradient(110deg, rgba(10, 12, 27, .97), rgba(15, 23, 42, .94));
            border: 1px solid rgba(147, 197, 253, .28);
            border-radius: 8px;
            box-shadow: 0 12px 38px rgba(0, 0, 0, .48);
            opacity: 0;
            transform: translate3d(-44px, 0, 0);
            pointer-events: none;
            transition: opacity .4s ease, transform .48s cubic-bezier(.16, 1, .3, 1);
        }
        #lower-third.visible { opacity: 1; transform: translate3d(0, 0, 0); }
        .accent-bar {
            flex: 0 0 10px;
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 55%, #1d4ed8 100%);
        }
        .text-content {
            min-width: 0;
            padding: 18px 34px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #primary-text {
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            overflow-wrap: anywhere;
            color: #fff;
            font-size: 50px;
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .25);
        }
        #secondary-text {
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            overflow-wrap: anywhere;
            margin-top: 6px;
            color: #bfdbfe;
            font-size: 27px;
            line-height: 1.2;
            font-weight: 550;
            letter-spacing: .4px;
        }
        @media (max-width: 1000px) {
            #lower-third { left: 40px; bottom: 40px; max-width: calc(100vw - 80px); min-height: 90px; }
            .accent-bar { flex-basis: 8px; }
            .text-content { padding: 14px 24px 16px; }
            #primary-text { font-size: clamp(32px, 5vw, 44px); }
            #secondary-text { font-size: clamp(19px, 2.7vw, 24px); }
        }
        @media (max-width: 600px) {
            #lower-third { left: 20px; bottom: 20px; max-width: calc(100vw - 40px); min-height: 0; }
            .accent-bar { flex-basis: 6px; }
            .text-content { padding: 10px 16px 12px; }
            #primary-text { font-size: clamp(22px, 6vw, 32px); }
            #secondary-text { margin-top: 3px; font-size: clamp(15px, 4vw, 20px); }
        }
        @media (prefers-reduced-motion: reduce) {
            #lower-third { transition: opacity .01ms; }
        }
    </style>
</head>
<body>
    <div id="lower-third" aria-live="polite">
        <div class="accent-bar" aria-hidden="true"></div>
        <div class="text-content">
            <span id="primary-text">Nombre</span>
            <span id="secondary-text">Cargo</span>
        </div>
    </div>

    <script>
        const lowerThird = document.getElementById('lower-third');
        const primaryText = document.getElementById('primary-text');
        const secondaryText = document.getElementById('secondary-text');
        const API_URL = 'https://api.npoint.io/2b81ca901938404ea4e7';
        const POLL_INTERVAL_MS = 2000;
        let isFetching = false;

        function applyState(data) {
            primaryText.textContent = typeof data.titulo === 'string' ? data.titulo.trim() : '';
            secondaryText.textContent = typeof data.subtitulo === 'string' ? data.subtitulo.trim() : '';
            lowerThird.classList.toggle('visible', data.activo === true);
        }

        async function verificarEstadoNube() {
            if (isFetching) return;
            isFetching = true;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch(API_URL + '?t=' + Date.now(), {
                    method: 'GET', cache: 'no-store',
                    headers: { 'Accept': 'application/json' }, signal: controller.signal
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                    throw new Error('Respuesta inválida de la nube');
                }
                applyState(data);
            } catch (error) {
                console.error('Error leyendo la nube:', error);
            } finally {
                clearTimeout(timeout);
                isFetching = false;
                setTimeout(verificarEstadoNube, POLL_INTERVAL_MS);
            }
        }

        verificarEstadoNube();
    </script>
</body>
</html>
