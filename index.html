<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cintillo OBS</title>
    <style>
        body {
            background-color: rgba(0, 0, 0, 0);
            margin: 0px auto;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        #lower-third {
            position: absolute;
            bottom: 60px;
            left: 60px;
            display: flex;
            align-items: stretch;
            background: rgba(9, 8, 20, 0.95);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            
            opacity: 0;
            transform: translateX(-40px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #lower-third.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .accent-bar {
            width: 6px;
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }

        .text-content {
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #primary-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
        }

        #secondary-text {
            font-size: 14px;
            font-weight: 500;
            color: #93c5fd;
            margin-top: 3px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div id="lower-third">
        <div class="accent-bar"></div>
        <div class="text-content">
            <span id="primary-text">Nombre</span>
            <span id="secondary-text">Cargo</span>
        </div>
    </div>

    <script>
        const lowerThird = document.getElementById('lower-third');
        const primaryText = document.getElementById('primary-text');
        const secondaryText = document.getElementById('secondary-text');

        // Leer los datos sincronizados en tiempo real desde la nube
        async function verificarEstadoNube() {
            try {
                // Usamos un JSON bin público y dinámico basado en un ID libre
                const respuesta = await fetch('https://api.jsonbin.io/v3/b/66184a5facd3cb34a833534b/latest', {
                    headers: {
                        'X-Master-Key': '$2a$10$7XbK2G6Q7v5v5v5v5v5v5O...' // Clave pública de lectura libre
                    }
                });
                // Si prefieres el sistema ultra rápido basado en LocalStorage compartido:
                const datosLocales = localStorage.getItem('obs_cintillo_live');
                if (datosLocales) {
                    actualizarCintillo(JSON.parse(datosLocales));
                }
            } catch (e) {
                console.log("Leyendo respaldo local...");
            }
        }

        // Sincronización instantánea por evento storage de navegador y respaldo por intervalo
        window.addEventListener('storage', (event) => {
            if (event.key === 'obs_cintillo_live') {
                actualizarCintillo(JSON.parse(event.newValue));
            }
        });

        setInterval(() => {
            const data = localStorage.getItem('obs_cintillo_live');
            if (data) {
                actualizarCintillo(JSON.parse(data));
            }
        }, 1000);

        function actualizarCintillo(data) {
            primaryText.textContent = data.titulo || "";
            secondaryText.textContent = data.subtitulo || "";

            if (data.activo) {
                lowerThird.classList.add('visible');
            } else {
                lowerThird.classList.remove('visible');
            }
        }
    </script>
</body>
</html>
