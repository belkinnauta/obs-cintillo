<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cintillo OBS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { color-scheme: dark; --name-size: 38px; --title-size: 22px; }
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent; color: #fff;
        }
        #artwork {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity .25s ease;
        }
        #artwork.loaded.visible { opacity: 1; }
        #text-overlay {
            position: fixed;
            left: var(--text-x, 20%);
            top: var(--text-y, 82%);
            width: max-content;
            max-width: 76vw;
            display: flex;
            flex-direction: column;
            gap: 5px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }
        #text-overlay.visible { opacity: 1; }
        #primary-text {
            display: block;
            max-width: 100%;
            white-space: nowrap;
            color: #fff;
            font-size: var(--name-size);
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .95), 0 0 14px rgba(0, 0, 0, .85);
        }
        #secondary-text {
            display: block;
            max-width: 100%;
            white-space: normal;
            overflow-wrap: break-word;
            color: #fff;
            font-size: var(--title-size);
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: .3px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .95), 0 0 14px rgba(0, 0, 0, .85);
        }
        @media (max-width: 1000px) {
            #text-overlay { max-width: 82vw; }
        }
        @media (max-width: 600px) {
            #text-overlay { max-width: 88vw; }
        }
        @media (prefers-reduced-motion: reduce) {
            #artwork, #text-overlay { transition: opacity .01ms; }
        }
    </style>
</head>
<body>
    <img id="artwork" alt="" aria-hidden="true">
    <div id="text-overlay" aria-live="polite">
        <span id="primary-text">Nombre</span>
        <span id="secondary-text">Cargo</span>
    </div>

    <script>
        const primaryText = document.getElementById('primary-text');
        const secondaryText = document.getElementById('secondary-text');
        const textOverlay = document.getElementById('text-overlay');
        const artwork = document.getElementById('artwork');
        const DEFAULT_ARTWORK = 'https://raw.githubusercontent.com/belkinnauta/obs-cintillo/main/cintillos/SUPER%20POMUCH%2026.png';
        const API_URL = 'https://api.npoint.io/2b81ca901938404ea4e7';
        const POLL_INTERVAL_MS = 2000;
        let isFetching = false;

        function setArtwork(source) {
            const nextSource = typeof source === 'string' && source.trim() ? source.trim() : DEFAULT_ARTWORK;
            if (artwork.src === nextSource) return;
            artwork.classList.remove('loaded');
            artwork.onload = () => artwork.classList.add('loaded');
            artwork.onerror = () => {
                artwork.classList.remove('loaded');
                console.error('No se pudo cargar el diseño PNG:', nextSource);
            };
            artwork.src = nextSource;
        }

        function fitNameToSingleLine() {
            const availableWidth = Math.min(window.innerWidth * .76, window.innerWidth - textOverlay.offsetLeft - 8);
            if (availableWidth <= 0) return;
            const desiredSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--name-size')) || 38;
            let fontSize = desiredSize;
            primaryText.style.fontSize = fontSize + 'px';
            while (primaryText.scrollWidth > availableWidth && fontSize > 12) {
                fontSize -= 1;
                primaryText.style.fontSize = fontSize + 'px';
            }
        }

        function applyState(data) {
            primaryText.textContent = typeof data.titulo === 'string' ? data.titulo.trim() : '';
            secondaryText.textContent = typeof data.subtitulo === 'string' ? data.subtitulo.trim() : '';
            const x = Number.isFinite(Number(data.posX)) ? Math.min(95, Math.max(0, Number(data.posX))) : 20;
            const y = Number.isFinite(Number(data.posY)) ? Math.min(95, Math.max(0, Number(data.posY))) : 82;
            const nameSize = Number.isFinite(Number(data.fontSizeNombre)) ? Math.min(80, Math.max(12, Number(data.fontSizeNombre))) : 38;
            const titleSize = Number.isFinite(Number(data.fontSizeCargo)) ? Math.min(60, Math.max(10, Number(data.fontSizeCargo))) : 22;
            document.documentElement.style.setProperty('--text-x', x + '%');
            document.documentElement.style.setProperty('--text-y', y + '%');
            document.documentElement.style.setProperty('--name-size', nameSize + 'px');
            document.documentElement.style.setProperty('--title-size', titleSize + 'px');
            setArtwork(data.bgImage);
            const isActive = data.activo === true;
            artwork.classList.toggle('visible', isActive);
            textOverlay.classList.toggle('visible', isActive);
            fitNameToSingleLine();
        }

        window.addEventListener('resize', fitNameToSingleLine);
        setArtwork(DEFAULT_ARTWORK);

        async function verificarEstadoNube() {
            if (isFetching) return;
            isFetching = true;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch(API_URL + '?t=' + Date.now(), {
                    method: 'GET', cache: 'no-store',
                    headers: { 'Accept': 'application/json' }, signal: controller.signal
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                    throw new Error('Respuesta inválida de la nube');
                }
                applyState(data);
            } catch (error) {
                console.error('Error leyendo la nube:', error);
            } finally {
                clearTimeout(timeout);
                isFetching = false;
                setTimeout(verificarEstadoNube, POLL_INTERVAL_MS);
            }
        }

        verificarEstadoNube();
    </script>
</body>
</html>
