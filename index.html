<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cintillo OBS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent; color: #fff;
        }
        #artwork {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity .25s ease;
        }
        #artwork.loaded { opacity: 1; }
        #lower-third {
            position: absolute;
            left: clamp(24px, 4vw, 64px);
            bottom: clamp(24px, 5vh, 64px);
            display: flex;
            align-items: stretch;
            width: fit-content;
            max-width: calc(100vw - 2 * clamp(24px, 4vw, 64px));
            background: linear-gradient(110deg, rgba(10, 12, 27, .92), rgba(15, 23, 42, .84));
            border: 1px solid rgba(147, 197, 253, .3);
            border-radius: 8px;
            box-shadow: 0 12px 38px rgba(0, 0, 0, .48);
            opacity: 0;
            transform: translate3d(-36px, 0, 0);
            pointer-events: none;
            transition: opacity .4s ease, transform .48s cubic-bezier(.16, 1, .3, 1);
        }
        #lower-third.visible { opacity: 1; transform: translate3d(0, 0, 0); }
        .accent-bar {
            flex: 0 0 9px;
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 55%, #1d4ed8 100%);
            border-radius: 8px 0 0 8px;
        }
        .text-content {
            flex: 1 1 auto;
            min-width: 0;
            padding: 16px 28px 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #primary-text {
            display: block;
            max-width: 100%;
            white-space: nowrap;
            color: #fff;
            font-size: 50px;
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .4);
        }
        #secondary-text {
            display: block;
            width: min(100%, 850px);
            white-space: normal;
            overflow-wrap: break-word;
            margin-top: 6px;
            color: #dbeafe;
            font-size: 27px;
            line-height: 1.2;
            font-weight: 550;
            letter-spacing: .4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, .45);
        }
        @media (max-width: 1000px) {
            .accent-bar { flex-basis: 7px; }
            .text-content { padding: 13px 22px 15px; }
            #primary-text { font-size: clamp(28px, 5vw, 44px); }
            #secondary-text { width: min(100%, 680px); font-size: clamp(18px, 2.7vw, 24px); }
        }
        @media (max-width: 600px) {
            .accent-bar { flex-basis: 6px; }
            .text-content { padding: 10px 15px 12px; }
            #primary-text { font-size: clamp(18px, 6vw, 32px); }
            #secondary-text { width: min(100%, 75vw); margin-top: 3px; font-size: clamp(14px, 4vw, 20px); }
        }
        @media (prefers-reduced-motion: reduce) {
            #artwork, #lower-third { transition: opacity .01ms; }
        }
    </style>
</head>
<body>
    <img id="artwork" alt="" aria-hidden="true">
    <div id="lower-third" aria-live="polite">
        <div class="accent-bar" aria-hidden="true"></div>
        <div class="text-content">
            <span id="primary-text">Nombre</span>
            <span id="secondary-text">Cargo</span>
        </div>
    </div>

    <script>
        const lowerThird = document.getElementById('lower-third');
        const primaryText = document.getElementById('primary-text');
        const secondaryText = document.getElementById('secondary-text');
        const artwork = document.getElementById('artwork');
        const DEFAULT_ARTWORK = 'https://raw.githubusercontent.com/belkinnauta/obs-cintillo/main/cintillos/SUPER%20POMUCH%2026.png';
        const API_URL = 'https://api.npoint.io/2b81ca901938404ea4e7';
        const POLL_INTERVAL_MS = 2000;
        let isFetching = false;

        function setArtwork(source) {
            const nextSource = typeof source === 'string' && source.trim() ? source.trim() : DEFAULT_ARTWORK;
            if (artwork.src === nextSource) return;
            artwork.classList.remove('loaded');
            artwork.onload = () => artwork.classList.add('loaded');
            artwork.onerror = () => {
                artwork.classList.remove('loaded');
                console.error('No se pudo cargar el diseño PNG:', nextSource);
            };
            artwork.src = nextSource;
        }

        function fitNameToSingleLine() {
            const content = primaryText.parentElement;
            const availableWidth = content.clientWidth;
            if (!availableWidth) return;
            let fontSize = window.innerWidth <= 600 ? Math.min(32, window.innerWidth * .06) :
                window.innerWidth <= 1000 ? Math.min(44, window.innerWidth * .05) : 50;
            const minFontSize = window.innerWidth <= 600 ? 14 : 20;
            primaryText.style.fontSize = fontSize + 'px';
            while (primaryText.scrollWidth > availableWidth && fontSize > minFontSize) {
                fontSize -= 1;
                primaryText.style.fontSize = fontSize + 'px';
            }
        }

        function applyState(data) {
            primaryText.textContent = typeof data.titulo === 'string' ? data.titulo.trim() : '';
            secondaryText.textContent = typeof data.subtitulo === 'string' ? data.subtitulo.trim() : '';
            setArtwork(data.bgImage);
            fitNameToSingleLine();
            lowerThird.classList.toggle('visible', data.activo === true);
        }

        window.addEventListener('resize', fitNameToSingleLine);
        setArtwork(DEFAULT_ARTWORK);

        async function verificarEstadoNube() {
            if (isFetching) return;
            isFetching = true;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch(API_URL + '?t=' + Date.now(), {
                    method: 'GET', cache: 'no-store',
                    headers: { 'Accept': 'application/json' }, signal: controller.signal
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                    throw new Error('Respuesta inválida de la nube');
                }
                applyState(data);
            } catch (error) {
                console.error('Error leyendo la nube:', error);
            } finally {
                clearTimeout(timeout);
                isFetching = false;
                setTimeout(verificarEstadoNube, POLL_INTERVAL_MS);
            }
        }

        verificarEstadoNube();
    </script>
</body>
</html>
